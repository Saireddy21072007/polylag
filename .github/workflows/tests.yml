name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # py-clob-client (live order signing) is deliberately not installed in CI;
      # the live-contract test skips without it.
      - run: pip install "httpx>=0.27,<1.0" "websockets>=12.0,<15.0" "feedparser>=6.0.11,<7.0" "PyYAML>=6.0,<7.0" "python-dotenv>=1.0,<2.0" pytest pytest-asyncio
      - run: python -m pytest tests -q
